# Veyano: builds the login image from a tag v<zitadel>-veyano.<n> (KAN-128).
# The only file of ours outside apps/login/; upstream's own workflows are disabled in this fork.
# Every action is pinned to a commit SHA (plan 2, P13); the comment names its release.
name: veyano-login
on:
  push:
    tags: ["v*-veyano.*"]
permissions:
  contents: read
  packages: write
env:
  NX_NO_CLOUD: "true"
  IMAGE: ghcr.io/veyano/login
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag is on a veyano/* branch
        run: |
          git fetch --no-tags origin '+refs/heads/veyano/*:refs/remotes/origin/veyano/*'
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/veyano/' \
            || { echo "tag $GITHUB_REF_NAME is not on a veyano/* branch" >&2; exit 1; }
      - name: The tag matches the release this branch was cut from
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-veyano.*' HEAD)"
          case "$GITHUB_REF_NAME" in
            "$base"-veyano.*) echo "building $GITHUB_REF_NAME on $base" ;;
            *) echo "tag $GITHUB_REF_NAME does not start with the branch's release $base" >&2; exit 1 ;;
          esac
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @zitadel/login:test-unit
      - run: pnpm nx run @zitadel/login:build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/login
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - run: echo "${IMAGE}:${GITHUB_REF_NAME} ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
