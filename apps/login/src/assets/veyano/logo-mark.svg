<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1673 615" width="83.65" height="30.75">
  <title>Veyano</title>
  <defs>
    <!-- rising arm and tail: violet at the tail, blue, bright cyan low on the rise -->
    <linearGradient id="vy-a" gradientUnits="userSpaceOnUse" x1="1418" y1="3" x2="785" y2="463">
      <stop offset="0" stop-color="#D552FC"/>
      <stop offset=".18" stop-color="#4249FC"/>
      <stop offset=".28" stop-color="#015EFC"/>
      <stop offset=".68" stop-color="#00D8FD"/>
      <stop offset=".85" stop-color="#00C6FD"/>
      <stop offset="1" stop-color="#008BFD"/>
    </linearGradient>
    <!-- left arm: blue, a lighter band on the descent, deep blue in the trough -->
    <linearGradient id="vy-l" gradientUnits="userSpaceOnUse" x1="251" y1="-35" x2="693" y2="646">
      <stop offset="0" stop-color="#0170FD"/>
      <stop offset=".08" stop-color="#005CFD"/>
      <stop offset=".28" stop-color="#01A8FC"/>
      <stop offset=".62" stop-color="#0043F1"/>
      <stop offset=".88" stop-color="#0058FC"/>
      <stop offset="1" stop-color="#0035D7"/>
    </linearGradient>
    <!-- underside of the left tip -->
    <linearGradient id="vy-u" gradientUnits="userSpaceOnUse" x1="121" y1="73" x2="27" y2="141">
      <stop offset="0" stop-color="#002BB0"/>
      <stop offset=".15" stop-color="#0027A9"/>
      <stop offset=".83" stop-color="#0137CC"/>
      <stop offset="1" stop-color="#0155E4"/>
    </linearGradient>
    <!-- underside of the tail: indigo in the curl, magenta at the tip -->
    <linearGradient id="vy-t" gradientUnits="userSpaceOnUse" x1="1428" y1="89" x2="1561" y2="293">
      <stop offset="0" stop-color="#2010C3"/>
      <stop offset=".43" stop-color="#7316F6"/>
      <stop offset=".93" stop-color="#D94CFC"/>
      <stop offset="1" stop-color="#DA3EF3"/>
    </linearGradient>
    <!-- fold rim: crisp cyan, fading in at the top -->
    <linearGradient id="vy-f" gradientUnits="userSpaceOnUse" x1="614" y1="325" x2="920" y2="501">
      <stop offset="0" stop-color="#1EE3FF" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#1EE3FF"/>
      <stop offset="1" stop-color="#3DEBFF"/>
    </linearGradient>
    <!-- rim light on the left tip (cyan) and the tail (pale pink) -->
    <linearGradient id="vy-h" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="1668" y2="0">
      <stop offset="0" stop-color="#2FCBFF"/>
      <stop offset=".14" stop-color="#19E0FF"/>
      <stop offset=".75" stop-color="#B58CFF" stop-opacity=".4"/>
      <stop offset=".95" stop-color="#F6B4FF" stop-opacity=".85"/>
    </linearGradient>
  </defs>
